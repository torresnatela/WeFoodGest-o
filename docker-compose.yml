services:
  postgres:
    image: postgres:17-alpine
    container_name: wefood-postgres
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: wefood
      POSTGRES_PASSWORD: wefood
      POSTGRES_DB: wefood
    volumes:
      - wefood-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wefood -d wefood"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wefood-postgres-data:

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wefood
          POSTGRES_PASSWORD: wefood
          POSTGRES_DB: wefood
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U wefood -d wefood"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run migrations:up

      - run: npm test

      - run: npm run lint
